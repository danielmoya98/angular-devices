<!-- Trigger Button in Topbar -->
<button
  type="button"
  (click)="open()"
  class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-full border border-border bg-muted/40 hover:bg-background text-muted-foreground hover:text-foreground text-xs transition-all w-48 sm:w-64 group shadow-2xs cursor-pointer"
>
  <ng-icon name="lucideSearch" class="text-sm shrink-0 group-hover:text-primary transition-colors" />
  <span class="truncate flex-1 text-left font-medium">Buscar o comando...</span>
  <kbd class="hidden sm:inline-flex items-center px-1.5 py-0.5 rounded-md text-[10px] font-mono font-bold bg-background border border-border shadow-2xs text-foreground/80">
    ⌘K
  </kbd>
</button>

<!-- Command Palette Global Modal Overlay (Fixed Viewport Center) -->
@if (isOpen()) {
  <div class="command-palette-overlay animate-fade-in">
    
    <!-- Modal Backdrop Click -->
    <div class="absolute inset-0 bg-black/65 backdrop-blur-md" (click)="close()"></div>

    <!-- Command Dialog Panel -->
    <div class="relative w-full max-w-lg mx-4 rounded-2xl bg-card text-card-foreground border border-border/80 shadow-2xl overflow-hidden z-10 animate-fade-in-up">
      
      <!-- Input Header -->
      <div class="flex items-center px-4 py-1 border-b border-border/80 bg-card">
        <ng-icon name="lucideSearch" class="text-lg text-muted-foreground shrink-0" />
        <input
          type="text"
          [value]="searchQuery()"
          (input)="searchQuery.set($any($event.target).value)"
          placeholder="Escribe un comando o busca un módulo..."
          class="w-full px-3.5 py-3.5 bg-transparent border-0 outline-none text-sm text-card-foreground placeholder:text-muted-foreground font-medium"
          autoFocus
        />
        <button
          type="button"
          (click)="close()"
          class="p-1.5 rounded-lg text-muted-foreground hover:text-card-foreground hover:bg-accent transition-colors cursor-pointer"
          aria-label="Cerrar modal"
        >
          <ng-icon name="lucideX" class="text-base" />
        </button>
      </div>

      <!-- Actions List -->
      <div class="max-h-80 overflow-y-auto p-2 space-y-1">
        @if (filteredActions().length === 0) {
          <div class="p-8 text-center text-xs text-muted-foreground">
            No se encontraron resultados para "{{ searchQuery() }}"
          </div>
        } @else {
          @for (item of filteredActions(); track item.id) {
            <button
              type="button"
              (click)="item.action()"
              class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-medium hover:bg-accent hover:text-accent-foreground text-card-foreground transition-colors group cursor-pointer"
            >
              <div class="flex items-center gap-3">
                <div class="size-8 rounded-lg bg-muted/60 flex items-center justify-center text-muted-foreground group-hover:bg-primary/10 group-hover:text-primary transition-colors">
                  <ng-icon [name]="item.icon" class="text-base" />
                </div>
                <span class="font-semibold text-foreground">{{ item.label }}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-muted/80 text-muted-foreground font-mono font-bold tracking-wider">
                  {{ item.category }}
                </span>
                <ng-icon name="lucideArrowRight" class="text-xs text-muted-foreground opacity-0 group-hover:opacity-100 transition-opacity" />
              </div>
            </button>
          }
        }
      </div>

      <!-- Footer Info -->
      <div class="px-4 py-2.5 bg-muted/30 border-t border-border/80 flex items-center justify-between text-[11px] text-muted-foreground">
        <span class="flex items-center gap-1.5">
          Presiona <kbd class="px-1.5 py-0.5 bg-background border border-border rounded-md font-mono text-[10px] font-bold">ESC</kbd> para salir
        </span>
        <span class="font-semibold tracking-tight text-foreground/70">Angular Devices</span>
      </div>

    </div>
  </div>
}

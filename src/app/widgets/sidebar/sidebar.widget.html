<aside
  class="fixed lg:sticky top-0 left-0 h-screen z-40 flex flex-col shrink-0 bg-sidebar text-sidebar-foreground border-r border-sidebar-border/80 transition-all duration-300 ease-in-out shadow-xl lg:shadow-none overflow-hidden"
  [class.w-64]="!isCollapsed()" [class.w-18]="isCollapsed()" [class.-translate-x-full]="!isMobileOpen()"
  [class.translate-x-0]="isMobileOpen()" [class.lg:translate-x-0]="true">
  <!-- Sidebar Header / Branding (Fixed h-16) -->
  <div class="h-16 flex items-center justify-between px-4 border-b border-sidebar-border/60 shrink-0">
    <div class="flex items-center gap-3 overflow-hidden">
      <div class="size-10 rounded-2xl bg-white flex items-center justify-center shrink-0 shadow-md p-1 border border-primary/20">
        <img src="assets/images/univalle-logo-red.png" alt="UNIVALLE Logo" class="size-full object-contain" />
      </div>
      @if (!isCollapsed()) {
      <div class="flex flex-col truncate animate-fade-in">
        <span class="font-bold tracking-tight text-sm text-sidebar-foreground">UNIVALLE</span>
        <span class="text-[10px] text-primary font-bold uppercase tracking-wider">Campus Universitario</span>
      </div>
      }
    </div>

    <!-- Mobile Close Button -->
    <button type="button" (click)="onCloseMobile()"
      class="lg:hidden p-1.5 rounded-xl text-sidebar-foreground/70 hover:text-sidebar-foreground hover:bg-sidebar-accent">
      <ng-icon name="lucideX" class="text-lg" />
    </button>
  </div>

  <!-- Navigation Menu Items (Scrollable middle) -->
  <div class="flex-1 py-4 px-3 overflow-y-auto space-y-1.5 min-h-0">
    @for (item of visibleNavItems(); track item.route) {
    <a [routerLink]="item.route"
      routerLinkActive="bg-primary/12 text-primary font-bold shadow-2xs border border-primary/20"
      (click)="onCloseMobile()"
      class="flex items-center gap-3.5 px-3.5 py-3 rounded-2xl text-sm font-medium transition-all duration-200 hover:bg-sidebar-accent/70 hover:text-sidebar-accent-foreground group relative"
      [title]="isCollapsed() ? item.label : ''">
      <ng-icon [name]="item.icon" class="text-lg shrink-0 group-hover:scale-110 transition-transform duration-200" />

      @if (!isCollapsed()) {
      <span class="truncate flex-1 animate-fade-in text-xs font-semibold tracking-tight">{{ item.label }}</span>
      @if (item.badge) {
      <span
        class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-500 border border-emerald-500/20">
        {{ item.badge }}
      </span>
      }
      }
    </a>
    }
  </div>

  <!-- Sidebar Footer / User Profile (Fixed bottom) -->
  <div class="p-3 border-t border-sidebar-border/60 flex flex-col gap-2 shrink-0 bg-sidebar">
    <app-user-dropdown [isCollapsed]="isCollapsed()"></app-user-dropdown>
  </div>

</aside>
